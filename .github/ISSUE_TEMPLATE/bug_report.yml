name: Bug report
description: Report a defect in FinWatch.
title: "fix: <short summary>"
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include real or proprietary data, secrets, or credentials.
        For security vulnerabilities, use private reporting (see SECURITY.md) —
        not a public bug report.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include logs or error output (with synthetic data only).
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Go/Node/Docker versions, commit SHA.
    validations:
      required: false
  - type: checkboxes
    id: guardrails
    attributes:
      label: Guardrails
      options:
        - label: This report contains synthetic data only and no secrets.
          required: true
