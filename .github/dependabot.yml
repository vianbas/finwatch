version: 2

# Version updates run monthly, with minor and patch updates grouped into one PR
# per ecosystem and a cooldown so fresh releases can settle first. Major updates
# still get their own PR. Security updates are not affected by schedule,
# grouping or cooldown: they are still opened as soon as an advisory is known.

updates:
  # Go backend modules
  - package-ecosystem: gomod
    directory: /apps/api
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - go

  # Frontend npm packages
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - javascript

  # GitHub Actions used in workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # GitHub Actions does not support per-semver cooldown keys.
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - github-actions
