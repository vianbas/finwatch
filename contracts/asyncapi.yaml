asyncapi: 3.0.0
info:
  title: FinWatch Realtime API
  version: 0.2.0
  description: |
    WebSocket/event contract for FinWatch. Real-time delivery uses a PostgreSQL
    transactional outbox relayed to an in-process WebSocket hub (no external
    brokers).

    Conventions:
      * Every event uses the common Envelope.
      * `occurredAt` is RFC 3339 (UTC).
      * Monetary fields are integer minor units.

    Connecting:
      * Browsers cannot set an Authorization header on a WebSocket handshake,
        so the access token travels in `Sec-WebSocket-Protocol`. The client
        offers exactly two subprotocols: `finwatch.v1` and
        `bearer.<access token>` (the same JWT returned by `POST /login`). The
        server verifies the token before upgrading and selects `finwatch.v1`.
        A missing or invalid token is rejected with HTTP 401 and the canonical
        error envelope; the upgrade does not happen.
      * The stream is server-to-client only. A client data message closes the
        connection with 1008 (policy violation).

    Delivery semantics:
      * At-least-once. An event can be delivered more than once (e.g. after a
        relay retry); clients must render idempotently, de-duplicating on the
        envelope `id`.
      * Events are pushed only to currently connected clients; there is no
        replay. Clients refetch REST state after (re)connecting.

    Server-initiated close codes:
      * 1001 (going away) — the server is shutting down. Reconnect.
      * 1008 (policy violation) — the access token expired. Log in again.
      * 1013 (try again later) — the client fell too far behind and was
        dropped. Reconnect and refetch.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  local:
    host: localhost:8080
    pathname: /ws
    protocol: ws
    description: Local development WebSocket endpoint.
    security:
      - $ref: "#/components/securitySchemes/bearerSubprotocol"

channels:
  events:
    address: /ws
    description: Server-to-client stream of operational events.
    messages:
      transactionObserved:
        $ref: "#/components/messages/TransactionObserved"
      alertRaised:
        $ref: "#/components/messages/AlertRaised"

operations:
  receiveEvents:
    action: receive
    channel:
      $ref: "#/channels/events"
    summary: Client receives operational events from the server.
    messages:
      - $ref: "#/channels/events/messages/transactionObserved"
      - $ref: "#/channels/events/messages/alertRaised"

components:
  securitySchemes:
    bearerSubprotocol:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        HS256 access token from `POST /login`, offered as the
        `bearer.<access token>` WebSocket subprotocol alongside `finwatch.v1`.
  messages:
    TransactionObserved:
      name: transaction.observed
      title: Transaction observed
      summary: Emitted when a synthetic transaction is ingested.
      payload:
        $ref: "#/components/schemas/TransactionObservedEnvelope"
    AlertRaised:
      name: alert.raised
      title: Alert raised
      summary: Emitted when an operational alert is raised from a rule match.
      payload:
        $ref: "#/components/schemas/AlertRaisedEnvelope"
  schemas:
    Envelope:
      type: object
      description: Common event envelope wrapping every realtime message.
      required: [id, type, version, occurredAt, data]
      properties:
        id:
          type: string
          description: |
            Unique, stable event identifier (the outbox row id as a decimal
            string). Redelivered events carry the same id.
        type:
          type: string
          description: Event type, e.g. transaction.observed or alert.raised.
        version:
          type: integer
          minimum: 1
          description: Schema version of the data payload.
        occurredAt:
          type: string
          format: date-time
          description: RFC 3339 (UTC) timestamp of when the event occurred.
        data:
          type: object
          description: Event-type-specific payload; see the per-event schemas.
          additionalProperties: true
    AlertRaisedEnvelope:
      description: |
        The alert.raised event. The `data` object is exactly what is stored in
        the transactional outbox row's payload.
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            type:
              const: alert.raised
            data:
              $ref: "#/components/schemas/AlertRaisedData"
    AlertRaisedData:
      type: object
      required: [alertId, ruleId, transactionId, severity, status, raisedAt]
      properties:
        alertId:
          type: string
          format: uuid
        ruleId:
          type: string
          format: uuid
        transactionId:
          type: string
          format: uuid
        severity:
          type: string
          enum: [low, medium, high, critical]
        status:
          type: string
          enum: [open, acknowledged, resolved]
        raisedAt:
          type: string
          format: date-time
    TransactionObservedEnvelope:
      description: |
        The transaction.observed event. The `data` object is exactly what is
        stored in the transactional outbox row's payload; the relay populates
        the envelope fields (id, type, occurredAt) from the outbox row.
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            type:
              const: transaction.observed
            data:
              $ref: "#/components/schemas/TransactionObservedData"
    TransactionObservedData:
      type: object
      required: [transactionId, accountId, amountMinor, currency, direction, status, occurredAt]
      properties:
        transactionId:
          type: string
          format: uuid
        accountId:
          type: string
        amountMinor:
          type: integer
          format: int64
          description: Integer minor units; always positive.
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        direction:
          type: string
          enum: [debit, credit]
        status:
          type: string
          enum: [posted]
        occurredAt:
          type: string
          format: date-time
